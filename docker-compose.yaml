version: "3"
services:
  postgres:
    image: postgres:latest
    container_name: comment-pg
    env_file:
      - .env
    ports:
      - "5432:5432"
    restart: on-failure
    volumes:
      - ./postgres-db:/var/lib/postgresql/data

  python:
    build:
      context: ./
      dockerfile: Dockerfile
    restart: on-failure
    env_file:
      - .env
    ports:
      - '232:8000'
    links:
      - postgres
    depends_on:
      - postgres

volumes:
  postgres-db: